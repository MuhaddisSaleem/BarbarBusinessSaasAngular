name: Generate backend initial migration

on:
  push:
    branches:
      - codex/backend-database-setup
    paths:
      - ".github/workflows/generate-backend-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/backend-database-setup

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore API
        run: dotnet restore backend/BarberFlow.Api/BarberFlow.Api.csproj

      - name: Generate initial migration
        run: |
          if [ -d backend/BarberFlow.Api/Data/Migrations ]; then
            echo "Migration directory already exists."
            exit 0
          fi

          dotnet ef migrations add InitialCreate \
            --project backend/BarberFlow.Api \
            --startup-project backend/BarberFlow.Api \
            --output-dir Data/Migrations

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/BarberFlow.Api/Data/Migrations
          git commit -m "feat: add initial EF Core migration"
          git push origin HEAD:codex/backend-database-setup
