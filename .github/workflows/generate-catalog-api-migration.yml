name: Generate catalog API migration

on:
  push:
    branches:
      - codex/bookings-api-angular-integration
    paths:
      - ".github/workflows/generate-catalog-api-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bookings-api-angular-integration

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet tool restore
      - run: dotnet restore backend/BarberFlow.Api/BarberFlow.Api.csproj

      - name: Generate migration
        run: |
          dotnet ef migrations add AddCatalogApiPersistence \
            --project backend/BarberFlow.Api \
            --startup-project backend/BarberFlow.Api \
            --output-dir Data/Migrations

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/BarberFlow.Api/Data/Migrations
          git commit -m "feat: add catalog API persistence migration"
          git push origin HEAD:codex/bookings-api-angular-integration
