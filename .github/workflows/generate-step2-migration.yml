name: Regenerate Step 2 migrations

on:
  push:
    branches:
      - codex/bookings-api-integration
    paths:
      - ".github/workflows/generate-step2-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bookings-api-integration

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet tool restore
      - run: dotnet restore backend/BarberFlow.Api/BarberFlow.Api.csproj

      - name: Regenerate clean initial migration
        run: |
          rm -rf backend/BarberFlow.Api/Data/Migrations

          dotnet ef migrations add InitialCreate \
            --project backend/BarberFlow.Api \
            --startup-project backend/BarberFlow.Api \
            --output-dir Data/Migrations

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend/BarberFlow.Api/Data/Migrations
          git commit -m "fix: regenerate SQL Server-compatible initial migration"
          git push origin HEAD:codex/bookings-api-integration
