<app-admin-shell eyebrow="ADMIN CENTER" title="Notifications">
  <div class="admin-content container-fluid">
    <section class="page-heading d-flex flex-wrap align-items-end justify-content-between gap-3">
      <div>
        <span class="eyebrow">ACTIVITY CENTER</span>
        <h2>Notifications</h2>
        <p>Stay updated on bookings, payments, schedule changes and salon activity.</p>
      </div>

      <div class="heading-actions d-flex align-items-center gap-2">
        <div class="dashboard-date d-none d-md-inline-flex">
          <i class="bi bi-calendar-event"></i>
          {{ currentDateLabel }}
        </div>
        <button type="button" class="mark-read-btn" (click)="markAllAsRead()" [disabled]="!notificationService.unreadCount">
          <i class="bi bi-check2-all"></i>
          Mark all as read
        </button>
      </div>
    </section>

    <section class="notification-card">
      <div class="notification-toolbar d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div class="notification-tabs d-flex">
          <button type="button" [class.active]="activeFilter === 'all'" (click)="setFilter('all')">
            All
            <span>{{ notificationService.notifications.length }}</span>
          </button>
          <button type="button" [class.active]="activeFilter === 'unread'" (click)="setFilter('unread')">
            Unread
            <span>{{ notificationService.unreadCount }}</span>
          </button>
        </div>

        <span class="notification-summary">{{ notificationService.unreadCount }} unread notifications</span>
      </div>

      <div class="notification-list">
        <button type="button"
          class="notification-row"
          *ngFor="let notification of notifications"
          [class.unread]="notification.unread"
          (click)="openNotification(notification)">
          <span class="notification-icon" [ngClass]="notification.type">
            <i class="bi" [ngClass]="notification.icon"></i>
          </span>

          <span class="notification-content">
            <span class="notification-title-row">
              <strong>{{ notification.title }}</strong>
              <i class="unread-dot" *ngIf="notification.unread"></i>
            </span>
            <span class="notification-message">{{ notification.message }}</span>
            <small><i class="bi bi-clock"></i>{{ notification.time }}</small>
          </span>

          <i class="bi bi-chevron-right notification-chevron"></i>
        </button>

        <div class="empty-state" *ngIf="!notifications.length">
          <i class="bi bi-bell-slash"></i>
          <strong>You’re all caught up</strong>
          <span>There are no unread notifications right now.</span>
        </div>
      </div>
    </section>
  </div>

</app-admin-shell>
