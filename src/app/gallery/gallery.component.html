<section id="gallery" class="studio-gallery" aria-labelledby="gallery-title">
  <div class="gallery-shell">
    <div class="gallery-heading">
      <span class="gallery-kicker">THE STUDIO</span>
      <h1 id="gallery-title">Inside The Trim Town</h1>
      <p>A closer look at the space, details and atmosphere behind the experience.</p>
    </div>

    <div class="studio-picture-gallery">
      <button
        *ngFor="let image of images; let i = index; trackBy: trackBySrc"
        type="button"
        class="gallery-tile"
        [ngClass]="image.className"
        [attr.aria-label]="'Open gallery image ' + (i + 1)"
        (click)="openImage(i)">
        <img
          [src]="image.src"
          [alt]="image.alt"
          loading="lazy"
          decoding="async">
        <span class="tile-shade" aria-hidden="true"></span>
        <span class="tile-open" aria-hidden="true">
          <i class="bi bi-arrows-fullscreen"></i>
        </span>
      </button>
    </div>
  </div>
</section>

<div
  *ngIf="selectedImage as image"
  class="gallery-lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Gallery image viewer"
  (click)="closeImage()">
  <button
    type="button"
    class="lightbox-close"
    aria-label="Close image"
    (click)="closeImage(); $event.stopPropagation()">
    <i class="bi bi-x-lg"></i>
  </button>

  <button
    type="button"
    class="lightbox-arrow lightbox-prev"
    aria-label="Previous image"
    (click)="previousImage(); $event.stopPropagation()">
    <i class="bi bi-chevron-left"></i>
  </button>

  <img
    [src]="image.src"
    [alt]="image.alt"
    (click)="$event.stopPropagation()">

  <button
    type="button"
    class="lightbox-arrow lightbox-next"
    aria-label="Next image"
    (click)="nextImage(); $event.stopPropagation()">
    <i class="bi bi-chevron-right"></i>
  </button>
</div>
