<header class="public-header navbar navbar-expand-xl navbar-dark p-0">
  <div class="header-shell container-fluid">
    <a
      class="brand navbar-brand d-inline-flex align-items-center m-0"
      [routerLink]="['/']"
      [attr.aria-label]="businessName + ' home'">
      <span class="brand-mark" aria-hidden="true">
        <img *ngIf="brandingMedia.logoUrl(); else defaultBrandMark" [src]="brandingMedia.logoUrl()" alt="">
        <ng-template #defaultBrandMark>
          <svg viewBox="0 0 64 72" role="img">
            <path d="M15 17 22 8l10 9L42 8l7 9-4 9H19l-4-9Z" fill="currentColor" />
            <circle cx="22" cy="8" r="2.8" fill="currentColor" />
            <circle cx="42" cy="8" r="2.8" fill="currentColor" />
            <path d="M17 31 47 63M47 31 17 63" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
            <circle cx="13" cy="66" r="7" fill="none" stroke="currentColor" stroke-width="3" />
            <circle cx="51" cy="66" r="7" fill="none" stroke="currentColor" stroke-width="3" />
          </svg>
        </ng-template>
      </span>

      <span class="brand-copy">
        <strong>{{ businessNameUpper }}</strong>
        <small *ngIf="brandSubtitle">{{ brandSubtitle }}</small>
      </span>
    </a>

    <button
      class="navbar-toggler border-0 shadow-none p-1"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#publicNavbar"
      aria-controls="publicNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="publicNavbar">
      <nav class="main-nav navbar-nav mx-xl-auto align-items-xl-center" aria-label="Main navigation">
        <a class="nav-link" [routerLink]="['/']" data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show">Home</a>
        <a class="nav-link" [class.active]="isAboutPage" [routerLink]="['/about']" data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show">About</a>
        <a class="nav-link" [routerLink]="['/']" fragment="services" data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show">Services</a>
        <a class="nav-link" [class.active]="isGalleryPage" [routerLink]="['/gallery']" data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show">Gallery</a>
        <a class="nav-link" [routerLink]="['/']" fragment="contact" data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show">Contact</a>
      </nav>

      <a
        class="book-button d-flex align-items-center justify-content-center mt-3 mt-xl-0"
        [routerLink]="['/']"
        fragment="booking"
        data-bs-toggle="collapse"
        data-bs-target=".navbar-collapse.show">
        Book Appointment
      </a>
    </div>
  </div>
</header>
